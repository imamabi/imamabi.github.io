<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="718" height="458" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>

  <text x="360" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Two-Stage Late-Fusion Ensemble (per target)</text>

  <!-- Base learners grid -->
  <text x="130" y="66" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4b5563">XGBoost</text>
  <text x="360" y="66" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4b5563">LightGBM</text>
  <text x="590" y="66" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4b5563">Random Forest</text>

  <!-- XGBoost column -->
  <rect x="60" y="76" width="60" height="40" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="90" y="100" text-anchor="middle" font-size="10.5" fill="#1f2937">FP-1</text>
  <rect x="130" y="76" width="60" height="40" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="160" y="100" text-anchor="middle" font-size="10.5" fill="#1f2937">FP-2</text>
  <rect x="200" y="76" width="60" height="40" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="230" y="100" text-anchor="middle" font-size="10.5" fill="#1f2937">FP-n</text>

  <!-- LightGBM column -->
  <rect x="290" y="76" width="60" height="40" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="320" y="100" text-anchor="middle" font-size="10.5" fill="#1f2937">FP-1</text>
  <rect x="360" y="76" width="60" height="40" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="390" y="100" text-anchor="middle" font-size="10.5" fill="#1f2937">FP-2</text>
  <rect x="430" y="76" width="60" height="40" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="460" y="100" text-anchor="middle" font-size="10.5" fill="#1f2937">FP-n</text>

  <!-- RF column -->
  <rect x="520" y="76" width="60" height="40" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="550" y="100" text-anchor="middle" font-size="10.5" fill="#1f2937">FP-1</text>
  <rect x="590" y="76" width="60" height="40" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="620" y="100" text-anchor="middle" font-size="10.5" fill="#1f2937">FP-2</text>
  <rect x="660" y="76" width="60" height="40" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="690" y="100" text-anchor="middle" font-size="10.5" fill="#1f2937">FP-n</text>

  <text x="360" y="140" text-anchor="middle" font-size="12" fill="#6b7280">base learners = algorithm &#215; fingerprint combinations</text>

  <!-- Stage 1 arrows into algorithm ensembles -->
  <line x1="90" y1="116" x2="130" y2="180" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="160" y1="116" x2="130" y2="180" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="230" y1="116" x2="130" y2="180" stroke="#9ca3af" stroke-width="1.5"/>

  <line x1="320" y1="116" x2="360" y2="180" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="390" y1="116" x2="360" y2="180" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="460" y1="116" x2="360" y2="180" stroke="#9ca3af" stroke-width="1.5"/>

  <line x1="550" y1="116" x2="590" y2="180" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="620" y1="116" x2="590" y2="180" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="690" y1="116" x2="590" y2="180" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Stage 1: algorithm-level ensembles -->
  <rect x="50" y="180" width="160" height="70" rx="8" fill="#eff6ff" stroke="#0f766e" stroke-width="2.5"/>
  <text x="130" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">XGBoost ensemble</text>
  <text x="130" y="226" text-anchor="middle" font-size="10.5" fill="#4b5563">AP-weighted average</text>
  <text x="130" y="240" text-anchor="middle" font-size="10.5" fill="#4b5563">across fingerprints</text>

  <rect x="280" y="180" width="160" height="70" rx="8" fill="#eff6ff" stroke="#0f766e" stroke-width="2.5"/>
  <text x="360" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">LightGBM ensemble</text>
  <text x="360" y="226" text-anchor="middle" font-size="10.5" fill="#4b5563">AP-weighted average</text>
  <text x="360" y="240" text-anchor="middle" font-size="10.5" fill="#4b5563">across fingerprints</text>

  <rect x="510" y="180" width="160" height="70" rx="8" fill="#eff6ff" stroke="#0f766e" stroke-width="2.5"/>
  <text x="590" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">RF ensemble</text>
  <text x="590" y="226" text-anchor="middle" font-size="10.5" fill="#4b5563">AP-weighted average</text>
  <text x="590" y="240" text-anchor="middle" font-size="10.5" fill="#4b5563">across fingerprints</text>

  <text x="360" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">Stage 1: within-algorithm late fusion</text>

  <!-- Stage 2 arrows into final ensemble -->
  <line x1="130" y1="250" x2="330" y2="320" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="360" y1="250" x2="360" y2="320" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="590" y1="250" x2="390" y2="320" stroke="#9ca3af" stroke-width="1.5"/>

  <rect x="250" y="320" width="220" height="66" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
  <text x="360" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Final model-level ensemble</text>
  <text x="360" y="370" text-anchor="middle" font-size="11" fill="#4b5563">simple average of the 3 algorithm ensembles</text>

  <text x="360" y="410" text-anchor="middle" font-size="12" fill="#6b7280">Stage 2: across-algorithm late fusion, evaluated on a held-out paired hERG/CYP3A4 external test set</text>
  <text x="360" y="430" text-anchor="middle" font-size="11" fill="#9ca3af">Trained independently for the hERG target and the CYP3A4 target</text>
</svg>
