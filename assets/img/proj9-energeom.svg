<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="638" height="418" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>

  <text x="320" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">EnerGeom E7 Featurization</text>

  <!-- Small molecule icon -->
  <g transform="translate(90,90)">
    <circle cx="0" cy="0" r="9" fill="#1f2937"/>
    <circle cx="34" cy="-18" r="9" fill="#1f2937"/>
    <circle cx="34" cy="22" r="9" fill="#1f2937"/>
    <circle cx="-30" cy="24" r="7" fill="#0f766e"/>
    <line x1="0" y1="0" x2="34" y2="-18" stroke="#1f2937" stroke-width="3"/>
    <line x1="0" y1="0" x2="34" y2="22" stroke="#1f2937" stroke-width="3"/>
    <line x1="0" y1="0" x2="-30" y2="24" stroke="#1f2937" stroke-width="3"/>
  </g>
  <text x="90" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Small molecule</text>

  <!-- Arrow to fusion box -->
  <line x1="160" y1="100" x2="215" y2="100" stroke="#0f766e" stroke-width="3"/>
  <polygon points="215,91 231,100 215,109" fill="#0f766e"/>

  <!-- Energetic terms box -->
  <rect x="235" y="55" width="170" height="55" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
  <text x="320" y="88" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">Energetic terms</text>

  <!-- Geometric terms box -->
  <rect x="235" y="120" width="170" height="55" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
  <text x="320" y="142" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">Geometric terms</text>
  <text x="320" y="160" text-anchor="middle" font-size="11.5" fill="#4b5563">shape, spread, RMSD flexibility</text>

  <!-- brace-like merge lines -->
  <line x1="405" y1="82" x2="450" y2="120" stroke="#9ca3af" stroke-width="2"/>
  <line x1="405" y1="147" x2="450" y2="120" stroke="#9ca3af" stroke-width="2"/>

  <!-- E7 fusion circle -->
  <circle cx="490" cy="120" r="42" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  <text x="490" y="126" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">E7</text>

  <!-- Arrow down to feature vector -->
  <line x1="490" y1="162" x2="490" y2="220" stroke="#0f766e" stroke-width="3"/>
  <polygon points="481,220 490,236 499,220" fill="#0f766e"/>

  <!-- Feature vector box -->
  <rect x="140" y="245" width="360" height="70" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
  <text x="320" y="275" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">ML-ready feature vector</text>
  <text x="320" y="296" text-anchor="middle" font-size="12.5" fill="#4b5563">for classification &amp; regression on bioactivity</text>

  <text x="320" y="355" text-anchor="middle" font-size="12" fill="#9ca3af">Energy-aware and geometry-aware descriptors for small-molecule ML</text>
</svg>
